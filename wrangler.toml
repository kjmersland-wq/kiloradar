# KiloRadar (kiloradar.com) — Cloudflare Pages + Functions + D1 Configuration
# Developed and operated by KM TECH LABS

name = "kiloradar"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[vars]
APP_URL = "https://kiloradar.com"

# -----------------------------------------------------------------------------
# Optional Cloudflare D1 SQLite Database Binding
# Note: You can bind D1 directly in Cloudflare Dashboard -> Pages -> Settings -> Bindings (Variable name: DB)
# OR uncomment the block below after running `npx wrangler d1 create kiloradar-db` and replacing database_id:
# -----------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "kiloradar-db"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# -----------------------------------------------------------------------------
# Optional Standalone Worker Cron Trigger (src/worker/cronUpdater.ts)
# When deploying the nightly cron worker separately via `wrangler deploy`:
# -----------------------------------------------------------------------------
# [triggers]
# crons = ["0 3 * * *"]
