                "name": "How does the Unit Price Calculator find the real price per kilo or ounce?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "KiloRadar automatically converts every package weight and volume (g, kg, ml, l, oz, lb, fl oz, and multipacks) into a standardized unit price so you can compare any two items fairly in seconds."

                "@type": "Question",
                "name": "What is shrinkflation and how does the Shrinkflation Tracker work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Shrinkflation happens when a manufacturer reduces package size while keeping the retail price the same or higher. KiloRadar computes the real unit-price surge with ((newPrice / newAmount) / (oldPrice / oldAmount) - 1) × 100."

              }
            ]
